<!doctype html>
<!-- Vibe Editing web scene: draw everything from window.renderFrame(t). Works with Canvas 2D or WebGL.
     Preview live:  npx http-server .  then open scene.html  (space = play/pause)
     Render:        node render.mjs scene.html --w 1080 --h 1920 --fps 30 --dur 6 -o ../out/web.mp4 -->
<html><head><meta charset="utf-8">
<style>
  /* brand fonts from the project's fonts/ folder (python3 vibe/fonts.py --brand) */
  @font-face { font-family: Display; src: url('../fonts/Unbounded-900.ttf'); }
  @font-face { font-family: Mono; src: url('../fonts/JetBrainsMono-700.ttf'); }
  html,body{margin:0;background:#0B0B0D;overflow:hidden} canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920);
const C = { ink: '#0B0B0D', paper: '#F2EEE3', lime: '#D4FF3F', peri: '#C4C6FF' };   // Ideabro house style
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const U = Math.min(W, H) / 1080;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, d) => clamp((t - s) / d);
const outBack = k => { const s = 1.70158; return 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2; };
const outExpo = k => k >= 1 ? 1 : 1 - 2 ** (-10 * k);

// fonts must be loaded before the first frame; the renderer waits for this promise
window.ready = Promise.all([document.fonts.load('100px Display'), document.fonts.load('100px Mono')]).catch(() => {});

window.renderFrame = function (t) {
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  // liquid blob background
  for (let i = 0; i < 5; i++) {
    const a = t * 0.6 + i * 1.3, r = (220 + 60 * Math.sin(t + i)) * U;
    g.fillStyle = i % 2 ? C.peri : C.lime; g.globalAlpha = 0.55;
    g.beginPath(); g.arc(W / 2 + Math.cos(a) * 260 * U, H / 2 + Math.sin(a * 1.2) * 420 * U, r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  const k = outBack(prog(t, 0.3, 0.6));
  g.save(); g.translate(W / 2, H / 2); g.scale(k, k);
  g.fillStyle = C.ink; g.font = `${130 * U}px Display, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('VIBE', 0, -80 * U); g.fillText('EDITING', 0, 80 * U);
  g.restore();
  const w = 560 * U * outExpo(prog(t, 1.0, 0.5));
  g.fillStyle = C.ink; g.fillRect(W / 2 - w / 2, H / 2 + 200 * U, w, 14 * U);
};

// live preview loop (ignored by the renderer, which calls renderFrame itself)
if (!P.has('render')) window.ready.then(() => {
  let t0 = performance.now(), playing = true, tp = 0;
  addEventListener('keydown', e => { if (e.code === 'Space') { playing = !playing; t0 = performance.now() - tp * 1000; } });
  const loop = () => { if (playing) tp = (performance.now() - t0) / 1000 % +(P.get('dur') || 6); renderFrame(tp); requestAnimationFrame(loop); };
  loop();
});
</script></body></html>
