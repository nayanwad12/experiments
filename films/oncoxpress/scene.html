<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OncoXpress overlay</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter-var.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --ink: #0b2e1c; --text: #0b2e1c; --muted: #66786d; --card: #f4f8f5; --card2: #e6f6ec;
    --line: rgba(11,46,28,.09); --a1: #0c9a4b; --a2: #3fd17f; --green: #12a150;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Inter", -apple-system, "Helvetica Neue", sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
  .layer { position: absolute; inset: 0; }
  .white { background: #fff; }
  .grad { background: linear-gradient(100deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .abs { position: absolute; }
  .center { left: 50%; top: 50%; transform: translate(-50%, -50%); }

  /* captions */
  #cap { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 44px; font-weight: 600;
         letter-spacing: -0.012em; line-height: 1.2; color: #fff; }
  #cap .pill { display: inline-block; padding: 12px 26px 14px; border-radius: 20px; background: rgba(18,161,80,.95);
               box-shadow: 0 10px 30px rgba(6,60,30,.25); }
  #cap .w { display: inline-block; margin: 0 0.125em; will-change: transform, opacity, filter; }

  /* questions */
  .q { position: absolute; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; color: var(--ink); }

  /* window chrome shared by the UI graphics */
  .win { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 30px; overflow: hidden;
         box-shadow: 0 40px 100px rgba(11,46,28,.14), 0 4px 14px rgba(11,46,28,.06); }
  .bar { height: 64px; display: flex; align-items: center; padding: 0 26px; gap: 10px; border-bottom: 1px solid var(--line); }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #e2e8e4; }
  .bar .title { margin-left: 18px; font-size: 21px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: var(--card2);
          font-size: 22px; font-weight: 560; color: #0b7a3e; }
  .card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px 32px; }
  .card h4 { margin: 18px 0 6px; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .card p { margin: 0; font-size: 20px; color: var(--muted); font-weight: 450; line-height: 1.35; }
  .icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
          background: linear-gradient(135deg, rgba(18,161,80,.13), rgba(63,209,127,.2)); }
  .label { font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }

  /* guidance */
  .big { position: absolute; left: 0; right: 0; text-align: center; font-size: 132px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  .node { position: absolute; transform: translate(-50%, -50%); text-align: center; }
  .node .ring { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center;
                background: #fff; border: 1.5px solid rgba(11,46,28,.1); box-shadow: 0 10px 30px rgba(11,46,28,.08); }
  .node .nm { font-size: 24px; font-weight: 600; color: var(--ink); }

  /* profile */
  .face { position: absolute; box-shadow: 0 30px 70px rgba(11,46,28,.18); background-size: cover; background-position: 52% 30%; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="work/timeline.js"></script>
  <script src="scene.js"></script>
</body>
</html>
